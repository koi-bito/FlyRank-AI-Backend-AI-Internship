<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kunal Aggarwal — Backend AI Engineer</title>
  <link rel="icon" type="image/svg+xml" href="../week-03/decide-once-identity-kit/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090D16;
      --card: #0F172A;
      --border: #1E293B;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --accent: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      max-width: 700px;
      line-height: 1.2;
    }
    p {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .cta-button {
      background-color: var(--accent);
      color: #042F2E;
      text-decoration: none;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .cta-button:hover { opacity: 0.9; }
    .footer {
      position: absolute;
      bottom: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="badge">
    <span class="badge-dot"></span>
    Stage 1 Deployed: Foundation Live over HTTPS
  </div>
  <h1>Kunal Aggarwal</h1>
  <p>I build resilient, failure-tolerant backend APIs and asynchronous background workers that prevent LLMs and databases from crashing production systems.</p>
  <a href="https://github.com" class="cta-button">Inspect Architecture on GitHub</a>
  <div class="footer">
    FlyRank Internship &bull; Netlify Deployment &bull; 200 OK
  </div>
</body>
</html>
