<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#090D16" />
  <!-- Border outline in subtle accent slate -->
  <rect x="2" y="2" width="96" height="96" rx="18" fill="none" stroke="#1E293B" stroke-width="2" />
  <!-- Monogram KA in sleek high-contrast electric emerald and ice white -->
  <text x="50" y="64" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="-2">
    K<tspan fill="#10B981">A</tspan>
  </text>
  <!-- Micro status pulse dot indicating live API status -->
  <circle cx="82" cy="22" r="5" fill="#10B981" />
</svg>
